# Lint with ruff and run the tests on all supported Python versions, using uv.
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10
    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uvx ruff check --select E9,F63,F7,F82 --output-format=github src tests
        # report all other findings without failing the build
        uvx ruff check --exit-zero --statistics src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --extra test
    - name: Test with pytest
      run: |
        # -m "" also runs the tests marked as slow
        uv run pytest -m ""
